<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpoint" content="width=device-width,initial-scale = 1.0">
        <title>{% block title %}音乐信息系统{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        {% load static %}
            <link rel="stylesheet" href="{% static 'musicapp/style.css' %}">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class = "container-fluid">
                <a class="navbar-brand" href="/"> 音乐信息系统</a>
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">歌曲列表</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/artists/">歌手列表</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/playlists/">歌单列表</a>
                    </li>
                </ul>
                <form class="d-flex" action="/search/" method="get">
                    <input class="form-control me-2" type="search" name="q" placeholder="输入关键词" required>
                    <select class="form-select me-2" name="type" style="width: auto;">
                        <option value="song">歌曲</option>
                        <option value="artist">歌手</option>
                    </select>
                    <button class="btn btn-outline-light" type="submit">搜索</button>
                </form>
            </div>
        </nav>
        <div class="container mt-4">
                {% block content %}
                {% endblock %}
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
        </script>
    </body>
</html>
