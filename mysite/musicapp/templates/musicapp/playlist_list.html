{% extends "musicapp/base.html" %}

{% block title %}歌单列表{% endblock %}

{% block content %}
<h1>歌单列表</h1>

<div class="playlist-grid">
    {% for source, songs in playlist.items %}
        <a href="/playlists/{{ source }}/" class="playlist-card">
            {{ source }}
            <span style="display: block;font-size: 12px; color: #999; font-weight: normal;">
                {{ songs |length }}首歌
            </span>
        </a>    
    {% endfor %}
</div>
{% endblock %}
